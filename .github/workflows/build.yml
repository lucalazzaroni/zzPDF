name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # GitHub retired its macOS 14 runners. The app still targets macOS 14; it is built and
    # tested on the oldest macOS GitHub still runs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Run smoke tests
        run: ./scripts/run-tests.sh
